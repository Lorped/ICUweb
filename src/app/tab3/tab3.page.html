<ion-header>
  <ion-toolbar color="medium">
    <ion-title>Messaggi</ion-title>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">

    <ion-list >
    @for (msg of messaggi; track msg) {
      <ion-item   >
        <ion-label class="ion-text-wrap" >
          <p>{{msg.Ora}}</p><div><b>{{msg.nomepg}}</b>: {{msg.Testo}} </div>
        </ion-label>
      </ion-item>
    }
  </ion-list>
  
</ion-content>
